<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="112" fill="#0f172a"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="#d97706" stroke-width="8" stroke-dasharray="16 12" opacity="0.4"/>
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="wineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
  </defs>
  <!-- Bar Glass & POS Symbol -->
  <g transform="translate(136, 110)">
    <!-- Wine Glass Bowl -->
    <path d="M40 30 Q40 140 120 170 L120 230 L70 230 C60 230 50 240 50 250 L190 250 C190 240 180 230 170 230 L120 230 L120 170 Q200 140 200 30 Z" fill="none" stroke="url(#goldGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Liquid inside -->
    <path d="M56 80 Q120 95 184 80 Q180 135 120 156 Q60 135 56 80 Z" fill="url(#wineGrad)" opacity="0.85"/>
    <!-- Sparkles -->
    <circle cx="205" cy="50" r="10" fill="#fbbf24"/>
    <polygon points="120,5 124,18 137,22 124,26 120,39 116,26 103,22 116,18" fill="#fde68a"/>
    <polygon points="220,105 223,114 232,117 223,120 220,129 217,120 208,117 217,114" fill="#fbbf24"/>
  </g>
  <!-- Text Label -->
  <text x="256" y="425" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" fill="#f8fafc" letter-spacing="3">CLUB VALENTINE</text>
  <text x="256" y="460" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="20" fill="#f59e0b" letter-spacing="4">BAR POS &amp; STOCK</text>
</svg>
